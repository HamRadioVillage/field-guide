name: Build LaTeX PDF

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    paths:
      - '**.tex'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdf
          path: cover.pdf
