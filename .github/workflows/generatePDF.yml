name: Build Page PDFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended
      
      - name: Create output directories
        run: |
          mkdir -p pages/generated
          mkdir -p pages/compiled

      - name: Convert Markdown to TeX
        run: |
          for f in pages/content/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" \
              --from=gfm \
              --to=latex \
              -o "pages/generated/${base}.tex"
          done

      - name: Show generated files
        run: |
          find pages -maxdepth 3 -type f | sort

      - name: Build PDF
        run: |
          mkdir -p pages/compiled
          latexmk -xelatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory=pages/compiled \
            pages/templates/templatePage2.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pages
          path: pages/compiled/*.pdf

      - name: Show compiled files
        run: |
          ls -la pages/compiled
