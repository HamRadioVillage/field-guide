name: Build Field Guide Zine

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils

      - name: Create output directories
        run: |
          mkdir -p pages/generated
          mkdir -p pages/compiled

      - name: Convert Markdown to TeX
        run: |
          for f in pages/content/*.md; do
            base=$(basename "$f" .md)

            echo "Converting $f"

            pandoc "$f" \
              --from=gfm \
              --to=latex \
              -o "pages/generated/${base}.tex"
          done

      - name: Show generated files
        run: |
          find pages -maxdepth 3 -type f | sort

      - name: Build all page PDFs
        run: |
          for template in pages/templates/*.tex; do
            echo "Building $template"

            latexmk -xelatex \
              -interaction=nonstopmode \
              -halt-on-error \
              -output-directory=pages/compiled \
              "$template"
          done

      - name: Verify required pages
        run: |
          required_files=(
            "templatePageF.pdf"
            "templatePage1.pdf"
            "templatePage2.pdf"
            "templatePage3.pdf"
            "templatePage4.pdf"
            "templatePage5.pdf"
            "templatePage6.pdf"
            "templatePageB.pdf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "pages/compiled/$file" ]; then
              echo "ERROR: Missing required page: $file"
              exit 1
            fi
          done

          echo "All required pages found."

      # ------------------------------------------------------------
      # Build normal sequential PDF
      # ------------------------------------------------------------

      - name: Assemble sequential Field Guide
        run: |
          pdfunite \
            pages/compiled/templatePageF.pdf \
            pages/compiled/templatePage1.pdf \
            pages/compiled/templatePage2.pdf \
            pages/compiled/templatePage3.pdf \
            pages/compiled/templatePage4.pdf \
            pages/compiled/templatePage5.pdf \
            pages/compiled/templatePage6.pdf \
            pages/compiled/templatePageB.pdf \
            pages/compiled/FieldOperatorGuide.pdf

      # ------------------------------------------------------------
      # Build one-sheet 8-page folding zine
      #
      # Physical layout:
      #
      #        TOP ROW (rotated 180 degrees)
      #
      #       [ 3 ] [ 4 ] [ 5 ] [ 6 ]
      #
      #       -------------------------
      #
      #       [ 2 ] [ 1 ] [ F ] [ B ]
      #
      #             BOTTOM ROW
      #
      # This is the standard one-sheet / PocketMod-style
      # eight-page folding arrangement.
      # ------------------------------------------------------------

      - name: Create zine imposition TeX
        run: |
          cat > pages/compiled/zine.tex <<'EOF'
          \documentclass{article}

          \usepackage[
            paperwidth=11in,
            paperheight=8.5in,
            margin=0in
          ]{geometry}

          \usepackage{graphicx}
          \usepackage{tikz}

          \pagestyle{empty}
          \setlength{\parindent}{0pt}

          \begin{document}

          \begin{tikzpicture}[
            remember picture,
            overlay
          ]

          % ==================================================
          % Each panel is:
          %
          %   1/4 sheet width  = 2.75 in
          %   1/2 sheet height = 4.25 in
          %
          % Nodes are positioned by CENTER.
          % ==================================================

          % --------------------------------------------------
          % TOP ROW
          % All pages rotated 180 degrees
          % --------------------------------------------------

          % Page 3
          \node[
            anchor=center,
            inner sep=0pt,
            rotate=180
          ] at
            ([xshift=0.125\paperwidth,
              yshift=-0.25\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage3.pdf}
          };

          % Page 4
          \node[
            anchor=center,
            inner sep=0pt,
            rotate=180
          ] at
            ([xshift=0.375\paperwidth,
              yshift=-0.25\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage4.pdf}
          };

          % Page 5
          \node[
            anchor=center,
            inner sep=0pt,
            rotate=180
          ] at
            ([xshift=0.625\paperwidth,
              yshift=-0.25\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage5.pdf}
          };

          % Page 6
          \node[
            anchor=center,
            inner sep=0pt,
            rotate=180
          ] at
            ([xshift=0.875\paperwidth,
              yshift=-0.25\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage6.pdf}
          };

          % --------------------------------------------------
          % BOTTOM ROW
          % Normal orientation
          % --------------------------------------------------

          % Page 2
          \node[
            anchor=center,
            inner sep=0pt
          ] at
            ([xshift=0.125\paperwidth,
              yshift=-0.75\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage2.pdf}
          };

          % Page 1
          \node[
            anchor=center,
            inner sep=0pt
          ] at
            ([xshift=0.375\paperwidth,
              yshift=-0.75\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePage1.pdf}
          };

          % Front cover
          \node[
            anchor=center,
            inner sep=0pt
          ] at
            ([xshift=0.625\paperwidth,
              yshift=-0.75\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePageF.pdf}
          };

          % Back cover
          \node[
            anchor=center,
            inner sep=0pt
          ] at
            ([xshift=0.875\paperwidth,
              yshift=-0.75\paperheight]
             current page.north west)
          {
            \includegraphics[
              width=0.25\paperwidth,
              height=0.5\paperheight,
              keepaspectratio
            ]{templatePageB.pdf}
          };

          \end{tikzpicture}

          \null

          \end{document}
          EOF

      - name: Build folding zine
        working-directory: pages/compiled
        run: |
          xelatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -jobname=FieldOperatorGuide_Zine \
            zine.tex

      - name: Verify final PDFs
        run: |
          echo "Sequential PDF:"
          pdfinfo pages/compiled/FieldOperatorGuide.pdf | grep Pages

          echo "Zine PDF:"
          pdfinfo pages/compiled/FieldOperatorGuide_Zine.pdf | grep Pages

          ZINE_PAGES=$(pdfinfo pages/compiled/FieldOperatorGuide_Zine.pdf \
            | awk '/Pages:/ {print $2}')

          if [ "$ZINE_PAGES" != "1" ]; then
            echo "ERROR: Zine should contain exactly one physical page."
            exit 1
          fi

          echo "Zine successfully generated as one physical sheet."

      - name: Upload complete Field Guide
        uses: actions/upload-artifact@v4
        with:
          name: field-operator-guide
          path: pages/compiled/FieldOperatorGuide.pdf

      - name: Upload printable folding zine
        uses: actions/upload-artifact@v4
        with:
          name: field-operator-guide-zine
          path: pages/compiled/FieldOperatorGuide_Zine.pdf

      - name: Upload individual page PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pages
          path: |
            pages/compiled/templatePageF.pdf
            pages/compiled/templatePage1.pdf
            pages/compiled/templatePage2.pdf
            pages/compiled/templatePage3.pdf
            pages/compiled/templatePage4.pdf
            pages/compiled/templatePage5.pdf
            pages/compiled/templatePage6.pdf
            pages/compiled/templatePageB.pdf
